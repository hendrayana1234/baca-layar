name: Build & Release

# Installer Windows dibuat otomatis setiap kali versi di package.json naik.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cek versi
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # Rilis dianggap lengkap bila latest.yml (dipakai update otomatis) sudah ada.
          if gh release view "v$V" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx 'latest.yml'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Rilis v$V sudah lengkap — tidak ada yang dibuat."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.ver.outputs.skip == 'false'
        with:
          node-version: 22
          cache: npm

      - name: Pasang dependensi
        if: steps.ver.outputs.skip == 'false'
        run: npm ci

      - name: Uji
        if: steps.ver.outputs.skip == 'false'
        run: npm test

      - name: Build installer
        if: steps.ver.outputs.skip == 'false'
        run: npx electron-builder --win nsis --x64 --publish never

      # Unggah sendiri lewat gh (electron-builder kadang membuat rilis dua kali bersamaan → gagal 422).
      - name: Terbitkan rilis
        if: steps.ver.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          cd dist
          FILES=("BacaLayar-Setup-$V.exe" "BacaLayar-Setup-$V.exe.blockmap" "latest.yml")
          ls -la "${FILES[@]}"
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" "${FILES[@]}" --clobber
          else
            gh release create "v$V" "${FILES[@]}" --target "$GITHUB_SHA" --title "Baca Layar $V" \
              --notes "Unduh **BacaLayar-Setup-$V.exe** di bawah lalu jalankan. Bila muncul SmartScreen: *Info selengkapnya → Tetap jalankan*. Aplikasi yang sudah terpasang akan memperbarui diri otomatis."
          fi

  linux:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v5

      - name: Cek versi
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --json assets --jq '.assets[].name' 2>/dev/null | grep -q 'linux-x64.AppImage'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.ver.outputs.skip == 'false'
        with:
          node-version: 22
          cache: npm

      - name: Pasang dependensi
        if: steps.ver.outputs.skip == 'false'
        run: npm ci

      - name: Build AppImage & deb
        if: steps.ver.outputs.skip == 'false'
        run: npm run dist:linux

      - name: Unggah ke rilis
        if: steps.ver.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          until gh release view "v$V" >/dev/null 2>&1; do sleep 15; done
          gh release upload "v$V" dist-linux/BacaLayar-$V-linux-x64.AppImage dist-linux/BacaLayar-$V-linux-x64.deb --clobber
