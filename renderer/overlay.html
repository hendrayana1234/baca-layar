<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Pilih area</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; cursor: crosshair; user-select: none; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  #shot { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; pointer-events: none; }
  #dim { position: fixed; inset: 0; background: rgba(8, 10, 16, .45); pointer-events: none; }
  #sel { position: fixed; display: none; border: 2px solid #f2b544; box-shadow: 0 0 0 9999px rgba(8, 10, 16, .55); pointer-events: none; }
  #sel.on { display: block; }
  body.selecting #dim { display: none; }
  #size { position: absolute; right: -2px; bottom: -26px; background: #f2b544; color: #1a1406; font: 600 12px/1 "Segoe UI", sans-serif; padding: 5px 7px; border-radius: 4px; white-space: nowrap; }
  #hint { position: fixed; top: 22px; left: 50%; transform: translateX(-50%); background: rgba(20, 23, 31, .92); color: #f4efe4; padding: 11px 18px; border-radius: 10px; font-size: 14px; letter-spacing: .1px; box-shadow: 0 8px 30px rgba(0,0,0,.35); pointer-events: none; }
  #hint b { color: #f2b544; font-weight: 600; }
  kbd { font: 600 11px/1 "Segoe UI", sans-serif; padding: 3px 6px; border-radius: 4px; background: #2a2f3b; color: #f4efe4; border: 1px solid #3a4150; margin: 0 2px; }
</style>
</head>
<body>
  <img id="shot" alt="">
  <div id="dim"></div>
  <div id="sel"><span id="size"></span></div>
  <div id="hint"><b>Seret</b> untuk memilih area teks &nbsp;·&nbsp; <kbd>Enter</kbd> seluruh layar &nbsp;·&nbsp; <kbd>Esc</kbd> batal</div>
  <script src="overlay.js"></script>
</body>
</html>
